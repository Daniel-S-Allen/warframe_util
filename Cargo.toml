[package]
name = "warframe_util"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = {version = "0.13", features = ["tokio", "global_shortcuts"]}
eframe = "0.34.2"
tokio = {version = "1.52", features = ["macros", "rt-multi-thread"]}
tesseract = "0.15.2"
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.29"
simple_logger = { version = "5.2.0", features = ["colors", "timestamps"] }
ftail = "0.3.1"
futures-util = "0.3.32"
